services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: crypto_processor
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build: .
        command: npm exec tsx apps/api/src/server.ts
        environment:
            PORT: ${PORT:-3000}
            DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
            REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
            REDIS_PORT: ${REDIS_PORT_DOCKER:-6379}
            REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
            CHAIN_ID: ${CHAIN_ID:-11155111}
            RPC_URL: ${RPC_URL:?RPC_URL is required}
            PRIVATE_KEY: ${PRIVATE_KEY:?PRIVATE_KEY is required}
            PRICE_API_BASE: ${PRICE_API_BASE:?PRICE_API_BASE is required}
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        build: .
        command: npm exec tsx apps/api/src/workers/index.ts
        environment:
            DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
            REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
            REDIS_PORT: ${REDIS_PORT_DOCKER:-6379}
            REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
            CHAIN_ID: ${CHAIN_ID:-11155111}
            RPC_URL: ${RPC_URL:?RPC_URL is required}
            PRIVATE_KEY: ${PRIVATE_KEY:?PRIVATE_KEY is required}
            PRICE_API_BASE: ${PRICE_API_BASE:?PRICE_API_BASE is required}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    ponder:
        build: .
        command: npm exec -- ponder start --root apps/indexer --config ponder.config.ts
        environment:
            DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
            CHAIN_ID: ${CHAIN_ID:-11155111}
            REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
            REDIS_PORT: ${REDIS_PORT_DOCKER:-6379}
            REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
            RPC_URL: ${RPC_URL:?RPC_URL is required}
            DEFAULT_ERC20_TOKEN: ${DEFAULT_ERC20_TOKEN:-0xbDeaD2A70Fe794D2f97b37EFDE497e68974a296d}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    pg_data:
