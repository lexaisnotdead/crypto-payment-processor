[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["node_modules", "lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
offline = true
fs_permissions = [{ access = "read-write", path = "./addresses" }]
